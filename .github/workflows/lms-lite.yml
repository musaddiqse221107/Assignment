name: LMS-Lite verification

on:
  push:
    paths:
      - 'LMS-Lite/**'
      - '.github/workflows/lms-lite.yml'
  pull_request:
    paths:
      - 'LMS-Lite/**'
      - '.github/workflows/lms-lite.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LMS-Lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode clean verify
